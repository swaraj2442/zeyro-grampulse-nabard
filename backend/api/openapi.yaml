openapi: 3.1.0
info:
  title: Zeyro B2B API
  version: 0.1.0
  description: Bootstrap contract for the Zeyro B2B platform.
servers:
  - url: https://sandbox-api.zeyro.in/b2b/v1
paths:
  /auth/token:
    post:
      summary: Exchange an API key for an access token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TokenRequest"
      responses:
        "200":
          description: Token issued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
  /ingest/upi:
    post:
      summary: Submit a raw UPI transaction payload for normalization and enrichment.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UPITransactionIngestRequest"
      responses:
        "202":
          description: Accepted for downstream enrichment.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IngestAcceptedResponse"
  /healthz:
    get:
      summary: Liveness check.
      responses:
        "200":
          description: Service is healthy.
  /onboarding:
    post:
      summary: Submit onboarding profile data for a new user.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OnboardingRequest"
      responses:
        "201":
          description: Onboarding profile saved successfully.
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    TokenRequest:
      type: object
      required: [api_key]
      properties:
        api_key:
          type: string
    TokenResponse:
      type: object
      required: [access_token, token_type, expires_in, partner_id, scopes]
      properties:
        access_token:
          type: string
        token_type:
          type: string
          example: Bearer
        expires_in:
          type: integer
        partner_id:
          type: string
          format: uuid
        scopes:
          type: array
          items:
            type: string
    UPITransactionIngestRequest:
      type: object
      required:
        [partner_id, user_ref, txn_id, timestamp, amount_inr, direction, data_source]
      properties:
        partner_id:
          type: string
          format: uuid
        user_ref:
          type: string
        txn_id:
          type: string
        timestamp:
          type: string
          format: date-time
        amount_inr:
          type: number
        direction:
          type: string
          enum: [DEBIT, CREDIT]
        counterparty_vpa:
          type: string
        raw_description:
          type: string
        data_source:
          type: string
          enum: [UPI, AA_BANK, AA_MF]
    IngestAcceptedResponse:
      type: object
      required: [status, txn_id, received_at]
      properties:
        status:
          type: string
          example: ACCEPTED
        txn_id:
          type: string
        received_at:
          type: string
          format: date-time
    OnboardingRequest:
      type: object
      required: [company_name, role, stage, preset_answers]
      properties:
        company_name:
          type: string
        role:
          type: string
        stage:
          type: string
        preset_answers:
          type: object
          description: Key-value mapping of questions to answers
          additionalProperties:
            type: string
