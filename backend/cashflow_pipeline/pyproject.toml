[project]
name = "cashflow-pipeline"
version = "1.0.0"
description = "Cashflow forecasting + liquidity stress pipeline for bank underwriting"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "prophet>=1.1.4",
    "lightgbm>=4.0.0",
    "scikit-learn>=1.3.0",
    "shap>=0.43.0",
    "scipy>=1.11.0",
    "joblib>=1.3.0",
    "mlflow>=2.12.0",
    "matplotlib>=3.7.0",
    "pyarrow>=13.0.0",
    "plotly>=5.0.0",
    "xgboost>=2.0.0",
    "torch>=2.0.0",
    "pytorch-lightning>=2.0.0",
    "pytorch-forecasting>=0.10.0",
    "dagshub>=0.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.ruff]
line-length = 88
select = ["E", "F", "I", "N", "W"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pyright]
executionEnvironments = [
  { root = "." }
]
extraPaths = ["."]
