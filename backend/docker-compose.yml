version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: zeyro-postgres
    environment:
      POSTGRES_DB: zeyro
      POSTGRES_USER: zeyro
      POSTGRES_PASSWORD: zeyro
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: zeyro-redis
    ports:
      - "6379:6379"

  nats:
    image: nats:2.10-alpine
    container_name: zeyro-nats
    command: ["-js"]
    ports:
      - "4222:4222"
      - "8222:8222"

volumes:
  postgres_data:

