openapi: 3.0.3
info:
  title: GramPulse API
  description: API for GramPulse Dashboard, including Copilot, Market, Intelligence, and Operations.
  version: 1.0.0
servers:
  - url: /api/v1
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
        meta:
          type: object
        data:
          type: object
          nullable: true
    SuccessResponse:
      type: object
      properties:
        data:
          type: object
        meta:
          type: object
        error:
          type: object
          nullable: true
security:
  - bearerAuth: []
paths:
  /auth/login:
    post:
      summary: Demo login
      security: []
      responses:
        '200':
          description: Successful login
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      accessToken:
                        type: string
                      expiresIn:
                        type: integer
                      user:
                        type: object
                        properties:
                          id:
                            type: string
                          name:
                            type: string
                          role:
                            type: string
                          regionId:
                            type: string
                  meta:
                    type: object
                  error:
                    type: string
                    nullable: true
  /user/profile:
    get:
      summary: Get user profile
      responses:
        '200':
          description: User profile and notifications
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
  /intelligence/early-warning/kpis:
    get:
      summary: Top level KPIs
      responses:
        '200':
          description: KPI cards data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
  /intelligence/early-warning/watchlist:
    get:
      summary: Enterprise watchlist
      responses:
        '200':
          description: Watchlist data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
  /intelligence/early-warning/risk-drivers:
    get:
      summary: Portfolio risk drivers
      responses:
        '200':
          description: Risk drivers
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
  /enterprises/{id}:
    get:
      summary: Get Enterprise Details
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Enterprise details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
  /enterprises/{id}/risk:
    get:
      summary: Get Enterprise Risk Assessment
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Risk assessment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
  /enterprises/{id}/signals:
    get:
      summary: Get Enterprise External Signals
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Signals data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
  /enterprises/{id}/loans:
    get:
      summary: Get Enterprise Loan Status
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Loan status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
  /copilot/chat:
    post:
      summary: AI Copilot Chat Interaction
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                conversationId:
                  type: string
                content:
                  type: string
                contextType:
                  type: string
                contextId:
                  type: string
      responses:
        '200':
          description: AI Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      conversationId:
                        type: string
                      messageId:
                        type: string
                      content:
                        type: string
                      suggestedPrompts:
                        type: array
                        items:
                          type: string
                      sources:
                        type: array
                        items:
                          type: object
                      actions:
                        type: array
                        items:
                          type: object
                  meta:
                    type: object
                  error:
                    type: string
                    nullable: true
