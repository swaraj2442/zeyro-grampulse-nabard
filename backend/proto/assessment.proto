syntax = "proto3";

package zeyro.assessment.v1;

option go_package = "github.com/arthazeyro/zeyro-b2b/proto/assessment;assessmentpb";

message AssessmentRequest {
  string assessment_id = 1;
  string partner_id = 2;
  string user_ref_hash = 3;
  repeated string products = 4;
  string consent_id = 5;
  string partner_ref_id = 6;
}

message AssessmentStatusRequest {
  string assessment_id = 1;
}

message AssessmentStatusResponse {
  string assessment_id = 1;
  string status = 2;
  string overall_signal = 3;
  string score_version = 4;
}

service AssessmentService {
  rpc CreateAssessment(AssessmentRequest) returns (AssessmentStatusResponse);
  rpc GetAssessmentStatus(AssessmentStatusRequest) returns (AssessmentStatusResponse);
}
