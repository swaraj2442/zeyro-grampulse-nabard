syntax = "proto3";

package zeyro.audit.v1;

option go_package = "github.com/arthazeyro/zeyro-b2b/proto/audit;auditpb";

message AuditEventRequest {
  string event_type = 1;
  string partner_id = 2;
  string actor_type = 3;
  string actor_ref = 4;
  string resource_type = 5;
  string resource_ref = 6;
  string status = 7;
  string payload_json = 8;
}

message AuditEventResponse {
  string event_id = 1;
  string occurred_at = 2;
}

service AuditService {
  rpc WriteAuditEvent(AuditEventRequest) returns (AuditEventResponse);
}
