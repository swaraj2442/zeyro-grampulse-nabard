syntax = "proto3";

package zeyro.consent.v1;

option go_package = "github.com/arthazeyro/zeyro-b2b/proto/consent;consentpb";

message ConsentInitiateRequest {
  string partner_id = 1;
  string user_ref_hash = 2;
  string purpose_code = 3;
  string data_from = 4;
  string data_to = 5;
}

message ConsentResponse {
  string consent_id = 1;
  string status = 2;
  string expires_at = 3;
}

message ConsentStatusRequest {
  string consent_id = 1;
}

service ConsentService {
  rpc InitiateConsent(ConsentInitiateRequest) returns (ConsentResponse);
  rpc GetConsentStatus(ConsentStatusRequest) returns (ConsentResponse);
}
